[project]
name = "sp-dynamo-firehose-s3"
version = "0.1.0"
description = "Claude Code skill that sets up a Databricks pipeline for a DynamoDB table streamed through Kinesis and Firehose to S3."
readme = "README.md"
authors = [
    { name = "jduran9987", email = "jduran9987@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.9",
]

[project.scripts]
create-stream = "sp_dynamo_firehose_s3.create_stream.main:main"
prepare-inputs = "sp_dynamo_firehose_s3.prepare_inputs.main:main"
scaffold = "sp_dynamo_firehose_s3.scaffold.main:main"
check-project = "sp_dynamo_firehose_s3.check_project.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
# Expected outputs of the generated project, checked byte for byte.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "ANN", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
