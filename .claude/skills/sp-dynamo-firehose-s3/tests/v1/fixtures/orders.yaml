version: v1

metadata:
  name: orders
  description: Pipeline to ingest orders.
  pythonVersion: "3.12"
  uvBuildVersion: ">=0.13.7,<0.14.0"

bundle:
  tags:
    project: orders
    SOURCE: dynamo
  targets:
    - dev:
        host: "https://dev-workspace.cloud.databricks.com"
        servicePrincipal: "sp_ingestion_dev"
        computePolicy: "DEVPOLICY"
        servicePrincipalPermissions: "can_manage"
        manageGroups:
          - "data_engineers"
          - "admins"
        runGroups:
          - "data_analysts"
        viewGroups: []
    - qa:
        host: "https://qa-workspace.cloud.databricks.com"
        servicePrincipal: "sp_ingestion_qa"
        computePolicy: "QAPOLICY"
        servicePrincipalPermissions: "can_manage"
        manageGroups:
          - "data_engineers"
          - "admins"
        runGroups:
          - "data_analysts"
        viewGroups: []
    - uat:
        host: "https://uat-workspace.cloud.databricks.com"
        servicePrincipal: "sp_ingestion_uat"
        computePolicy: "UATPOLICY"
        servicePrincipalPermissions: "can_manage"
        manageGroups:
          - "data_engineers"
          - "admins"
        runGroups:
          - "data_analysts"
        viewGroups: []
    - prod:
        host: "https://prod-workspace.cloud.databricks.com"
        servicePrincipal: "sp_ingestion_prod"
        computePolicy: "PRODPOLICY"
        servicePrincipalPermissions: "can_manage"
        manageGroups:
          - "data_engineers"
          - "admins"
        runGroups:
          - "data_analysts"
        viewGroups: []
        onJobFailureWebhookNotificationIds:
          - "XXXXXXXXX"
        onJobFailureEmails:
          - "jduran9987@gmail.com"
        onTaskFailureWebhookNotificationIds:
          - "XXXXXXXXX"
        onTaskFailureEmails:
          - "jduran9987@gmail.com"

job:
  executionMode: "continuous"
  bronze:
    sourcePath: "s3://{env}-datalake-7472/scaffoldskill/data/"
    checkpointPath: "s3://{env}-datalake-7472/scaffoldskill/bronze/checkpoint/"
    targetTable: "{env}.bronze.orders"
    triggerInterval: "1 minute"
  silver:
    checkpointPath: "s3://{env}-datalake-7472/scaffoldskill/silver/checkpoint/"
    targetTable: "{env}.silver.orders"
    triggerInterval: "1 minute"
  gold:
    upsertLatestKey: _event_timestamp
    checkpointPath: "s3://{env}-datalake-7472/scaffoldskill/gold/checkpoint/"
    targetTable: "{env}.gold.orders"
    triggerInterval: "1 minute"

schema:
  columns:
    - name: id
      description: "Order identifier."
      dynamoType: N
      targetType: int
      path: id
      key: true
    - name: created_at 
      description: "UTC timestamp when an order was created."
      dynamoType: S
      targetType: timestamp
      path: createdAt
      key: true
    - name: amount
      description: "Order amount in dollars."
      dynamoType: N
      targetType: decimal(22, 2) 
      path: amount 
    - name: status
      description: "Order status."
      dynamoType: S
      targetType: string
      path: status 
    - name: address__city
      description: "City from where the order was placed."
      dynamoType: S
      targetType: string
      path: addressDetails.M.city
    - name: address__state
      description: "State from where the order was placed."
      dynamoType: S
      targetType: string
      path: addressDetails.M.state
    - name: address__zip_code
      description: "Zip code from where the order was placed."
      dynamoType: S
      targetType: string
      path: addressDetails.M.zipCode
  primaryKeys:
    - id
    - created_at
